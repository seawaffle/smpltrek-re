/*
 * SYS/BIOS configuration used to build a custom sysbios library for lib_match.py (claim LIB-3).
 * It is a guess at Sonicware's configuration, not theirs: it uses the modules seen in SmplTrek 3.2.174
 * and turns off logging, which raised the exact matches from 55 to 68 (Semaphore.supportsEvents, 69).
 * Entries in symbols/ come from the union of this build and the variants noted below; no name was
 * found at different addresses by different variants.
 *
 * Build (scratch directory; SYS/BIOS 6.76.03.01, XDCtools 3.55.02.22, CGT 8.3.13):
 *   ~/ti/xdctools_3_55_02_22_core/xs --xdcpath="$HOME/ti/bios_6_76_03_01/packages" xdc.tools.configuro \
 *       -t ti.targets.elf.C674 -p ti.platforms.evm6748 -r release -c ~/ti/ti-cgt-c6000_8.3.13 -o cfgout sysbios_match.cfg
 *   python3 -B analysis/lib_match.py "firmware/smpltrek/SmplTrek v3.2.174.zip" \
 *       cfgout/package/cfg/sysbios_match_pe674.src/sysbios/sysbios.ae674 -o work/smpltrek-3.2.174.sysbios.libmatch.json
 * Variants tried (unique matches in 3.2.174): defaults 55; assertsEnabled = false 47; both off 55;
 * logsEnabled = false 68; + supportsEvents 69; + Task.initStackFlag = false 67; + deleteTerminatedTasks 66;
 * + Semaphore.supportsPriority = false 68; + runtimeCreatesEnabled = false 67.
 */
var BIOS = xdc.useModule('ti.sysbios.BIOS');
var Task = xdc.useModule('ti.sysbios.knl.Task');
var Semaphore = xdc.useModule('ti.sysbios.knl.Semaphore');
var Mailbox = xdc.useModule('ti.sysbios.knl.Mailbox');
var Event = xdc.useModule('ti.sysbios.knl.Event');
var Clock = xdc.useModule('ti.sysbios.knl.Clock');
var Swi = xdc.useModule('ti.sysbios.knl.Swi');
var Queue = xdc.useModule('ti.sysbios.knl.Queue');
var Hwi = xdc.useModule('ti.sysbios.family.c64p.Hwi');
var Cache = xdc.useModule('ti.sysbios.family.c64p.Cache');
var HeapMem = xdc.useModule('ti.sysbios.heaps.HeapMem');
var GateHwi = xdc.useModule('ti.sysbios.gates.GateHwi');
var GateMutex = xdc.useModule('ti.sysbios.gates.GateMutex');
var Timer = xdc.useModule('ti.sysbios.timers.timer64.Timer');
var Memory = xdc.useModule('xdc.runtime.Memory');
var SysMin = xdc.useModule('xdc.runtime.SysMin');
var System = xdc.useModule('xdc.runtime.System');
System.SupportProxy = SysMin;
BIOS.heapSize = 0x10000;
BIOS.libType = BIOS.LibType_Custom;
BIOS.logsEnabled = false;
Semaphore.supportsEvents = true;
